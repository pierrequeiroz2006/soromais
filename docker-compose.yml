version: '3'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # NEVER commit a real password. Provide it via a local .env file
      # (gitignored) or your secret manager. Rotate if it was ever public.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"

  evolution:
    image: atendai/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}
      # Generate a strong value and keep it secret: `openssl rand -hex 32`
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
    depends_on:
      - postgres
